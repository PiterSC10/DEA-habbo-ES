name: DEA V6 checks
on:
  push:
    branches:
      - main
      - lanzamiento-google-apps-script
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias bloqueadas
        run: npm ci --ignore-scripts
      - name: Validate public V6
        run: npm run check
      - name: Build GitHub Pages assets
        run: npm run build
