name: DEA V6 checks

on:
  push:
    branches:
      - main
      - feature/v6-inauguracion-acceso-seguro
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS and tests
        run: npm run check
      - name: Build public files
        run: npm run build
