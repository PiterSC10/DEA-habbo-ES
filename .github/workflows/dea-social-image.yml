name: Generate DEA social preview
on:
  push:
    branches: [main]
    paths:
      - og-dea-oficial.svg
      - .github/workflows/dea-social-image.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert artwork to social JPEG
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import cairosvg,io
          from PIL import Image
          raw=cairosvg.svg2png(url='og-dea-oficial.svg',output_width=1200,output_height=630)
          Image.open(io.BytesIO(raw)).convert('RGB').save('og-dea-oficial.jpg',quality=90,optimize=True)
          PY
      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-dea-oficial.jpg
          git diff --cached --quiet || (git commit -m "Generate DEA official social image" && git push)
