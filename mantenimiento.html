<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061629">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>DEA en reformas · Mantenimiento</title>
<meta name="description" content="Agencia Oficial DEA está realizando mejoras en la web.">
<link rel="icon" href="/favicon-48.png" type="image/png">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html{min-height:100%;background:#05101e}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(ellipse at 50% 30%,#174365 0,#071a31 57%,#030b15 100%);color:#f5f7fa;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body:before{content:"";position:fixed;inset:-20%;pointer-events:none;background:repeating-linear-gradient(110deg,transparent 0 40px,#3bd9fc0b 45px,transparent 60px);animation:moveGlow 28s linear infinite}
.maint{z-index:1;width:min(1080px,calc(100% - 28px));margin:22px auto;text-align:center}
.maint-head{margin:0 0 12px;color:#e8c480;letter-spacing:.22em;text-transform:uppercase;font-weight:900;font-size:clamp(10px,1.5vw,14px)}
.frame{position:relative;overflow:hidden;border:2px solid #d2a64b;border-radius:20px;background:#081627;box-shadow:0 20px 90px #000b,0 0 32px #57d7ed32}
.frame:before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border:1px solid #fce7a252;border-radius:18px}
.frame img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
.beacon{position:absolute;left:3%;bottom:6%;width:9px;height:9px;border-radius:50%;background:#ffce60;box-shadow:0 0 16px 7px #e6ae4690;animation:blink 2s ease-in-out infinite;z-index:3}
.maint-foot{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px auto 0;font-size:clamp(11px,1.4vw,14px);line-height:1.5;color:#bed2df}.maint-foot strong{color:#edcd82}.maint-status{display:inline-flex;align-items:center;gap:9px;padding:8px 16px;border:1px solid #6fdce366;border-radius:99px;background:#082238a8;color:#9aebf4;font-weight:700;letter-spacing:.06em}.maint-status:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#70e8ef;box-shadow:0 0 13px #58e0ee;animation:blink 2.1s ease-in-out infinite}
.maint-note{font-size:11px;color:#8aa9bc;margin:12px 0 0}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}@keyframes moveGlow{from{transform:translateX(-7%)}to{transform:translateX(7%)}}
@media(max-width:620px){.maint{width:calc(100% - 16px);margin:10px auto}.frame{border-radius:12px}.frame:before{border-radius:10px}.frame img{aspect-ratio:4/5;object-fit:cover;object-position:center}.maint-foot{padding:0 7px}.maint-head{letter-spacing:.14em}}
@media(prefers-reduced-motion:reduce){body:before,.beacon,.maint-status:before{animation:none}}
</style>
</head>
<body>
<main class="maint" aria-labelledby="title">
<p class="maint-head" id="title">Agencia Oficial DEA · Intervención técnica</p>
<div class="frame">
<img src="https://d2ol7oe51mr4n9.cloudfront.net/user_3JG75h2Nju8XQikwbWBljGYXsX6/c41cf277-5f45-4c08-91b6-f162abad919e.png" alt="Ilustración estilo Habbo de la sede DEA en reformas, con operarios, vallas y escudo azul y dorado" width="1648" height="928" fetchpriority="high">
<span class="beacon" aria-hidden="true"></span>
</div>
<div class="maint-foot"><span class="maint-status">REFORMAS EN CURSO</span><span><strong>Acceso temporalmente limitado.</strong> Estamos actualizando la web de DEA.</span></div>
<p class="maint-note">La imagen representa una escena de mantenimiento. Su porcentaje es decorativo y no refleja el progreso real.</p>
</main>
</body>
</html>
